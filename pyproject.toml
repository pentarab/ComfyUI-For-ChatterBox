[project]
name = "comfyui-for-chatterbox"
version = "1.0.3"
description = "ComfyUI custom nodes for Chatterbox TTS with multilingual support (23 languages)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }

dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "librosa==0.11.0",
    "s3tokenizer",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "transformers==4.46.3",
    "diffusers==0.29.0",
    "resemble-perth==1.0.1",
    "conformer==0.3.2",
    "safetensors==0.5.3",
    "spacy-pkuseg",
    "pykakasi==2.3.0",
    "gradio==5.44.1",
    "pyloudnorm",
    "omegaconf"
]

[project.urls]
Repository = "https://github.com/pentarab/ComfyUI-For-ChatterBox"

[tool.comfy]
PublisherId = "james"
DisplayName = "comfyui-for-chatterbox"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*"]
